name: go-publisher
description: >-
  Installs the go-publisher release this action carries, checked against the
  release's checksums, and runs it.

inputs:
  args:
    description: Arguments go-publisher runs with, split on whitespace, such as `release --clean`.
    required: true
  workdir:
    description: Directory go-publisher runs in.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install go-publisher
      shell: bash
      env:
        VERSION: v0.0.3
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCHITECTURE: ${{ runner.arch }}
      run: bash "${{ github.action_path }}/scripts/install-go-publisher.sh"

    - name: Run go-publisher
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail -o noglob
        go-publisher $ARGS
