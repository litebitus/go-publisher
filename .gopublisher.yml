# yaml-language-server: $schema=schemas/go-publisher-v2.1.schema.json
version: 2

project_name: go-publisher

git:
  tag_prefix: v

before:
  hooks:
    - go run ./internal/schemaassets .schema-assets

builds:
  - id: go-publisher
    binary: go-publisher
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }} -X main.builtBy=go-publisher -X main.treeState={{ .IsGitDirty }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  prerelease: auto
  extra_files:
    - glob: .schema-assets/*.schema.json
