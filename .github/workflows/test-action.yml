name: Test Action

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-action.yml"
      - "action.yml"
  pull_request:
    paths:
      - ".github/workflows/test-action.yml"
      - "action.yml"
  workflow_call:
    inputs:
      runners:
        description: The runner labels the action is tested on, as a JSON array.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-action:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["macos-26", "ubuntu-26.04", "ubuntu-26.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check the configuration with the action
        uses: ./
        with:
          version: v0.0.3
          args: check
