name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - "action.yml"
      - ".gopublisher.yml"
      - "LICENSE.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - "action.yml"
      - ".gopublisher.yml"
      - "LICENSE.md"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: network=host

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Install upx
        uses: crazy-max/ghaction-upx@v4.0.0
        with:
          install-only: true

      - name: Install flatpak and makeself
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq makeself flatpak flatpak-builder

      - name: Install the flatpak runtimes
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.freedesktop.Platform/x86_64/24.08 \
            org.freedesktop.Sdk/x86_64/24.08 \
            org.freedesktop.Platform/aarch64/24.08 \
            org.freedesktop.Sdk/aarch64/24.08

      - name: Install the Nix formatters
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/alejandra" \
            https://github.com/kamadorueda/alejandra/releases/download/4.1.0/alejandra-x86_64-unknown-linux-musl
          curl -fsSL -o "$HOME/.local/bin/nixfmt" \
            https://github.com/NixOS/nixfmt/releases/download/v1.5.0/nixfmt
          echo "1f977b58dabc146d1f1c872272b5c3136b9f3152b41bc91a60ec2ad4eb3f70ad  $HOME/.local/bin/alejandra" | sha256sum -c -
          echo "aa029247ab89c897e2f3948463967553f902f86e86e3402fa28cb29c4a44f745  $HOME/.local/bin/nixfmt" | sha256sum -c -
          chmod +x "$HOME/.local/bin/alejandra" "$HOME/.local/bin/nixfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.5

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.28.0

      - name: Install cargo-zigbuild
        run: |
          rustup default stable
          cargo binstall -y cargo-zigbuild

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install poetry
        run: uv tool install poetry

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.4
        with:
          cosign-release: "v3.1.5"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.4

      - name: Test
        run: make test
