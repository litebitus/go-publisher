name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level: auto (from Conventional Commits, never across a major), patch, minor or major."
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: patch
      version:
        description: "An explicit version, such as v1.2.3, for the first release; empty computes it from bump."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Compute and print the next version without changing anything."
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      - name: Compute the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            next="$OVERRIDE"
          else
            case "$BUMP" in
              patch|minor|major) next="$(svu "$BUMP")" ;;
              auto)
                next="$(svu next)"
                if [ "${next%%.*}" != "$(svu current | cut -d. -f1)" ]; then
                  next="$(svu minor)"
                fi
                ;;
            esac
          fi
          current="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '(none)')"
          if [ "$next" = "$current" ]; then
            echo "no version change ($next); nothing to release" >&2
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Current: $current -> Next: $next"

      - name: Check the release before changing anything
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/${NEXT}")" ]; then
            echo "tag $NEXT already exists on origin" >&2
            exit 1
          fi
          awk '/^## Unreleased$/ { inside = 1; next } /^## / { inside = 0 } inside && NF { found = 1 } END { exit !found }' CHANGELOG.md ||
            { echo "CHANGELOG.md has nothing under '## Unreleased' to release as $NEXT" >&2; exit 1; }

      - name: Stamp the changelog, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          awk '/^## Unreleased$/ { inside = 1; next } /^## / { inside = 0 } inside' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          export RELEASE_DATE="$(date -u +%Y-%m-%d)"
          perl -pi -e 's/^## Unreleased$/$&\n\n## $ENV{NEXT} — $ENV{RELEASE_DATE}/' CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): ${NEXT}"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "$NEXT"

      - name: Build and publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . release --clean --release-notes "$RUNNER_TEMP/release-notes.md"

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=7 HEAD)"
          echo "Released \`go-publisher\` \`${NEXT#v}\` from commit \`${commit}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN - would release ${{ steps.version.outputs.next }}"
